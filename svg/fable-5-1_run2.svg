<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="1" stop-color="#cfeaff"/>
    </linearGradient>
  </defs>

  <!-- 背景: 空 -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="45" fill="#ffd54f"/>
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="150" cy="110" rx="60" ry="26"/>
    <ellipse cx="190" cy="95" rx="45" ry="30"/>
    <ellipse cx="110" cy="100" rx="35" ry="22"/>
    <ellipse cx="520" cy="80" rx="55" ry="22"/>
    <ellipse cx="555" cy="65" rx="40" ry="26"/>
  </g>

  <!-- 背景: 地面 -->
  <rect x="0" y="480" width="800" height="120" fill="#7cb342"/>
  <rect x="0" y="480" width="800" height="4" fill="#558b2f"/>
  <rect x="0" y="515" width="800" height="22" fill="#8d6e63"/>
  <rect x="0" y="537" width="800" height="3" fill="#5d4037"/>

  <!-- 自転車 -->
  <g stroke="#263238" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 後輪 -->
    <circle cx="250" cy="440" r="80" stroke-width="10"/>
    <circle cx="250" cy="440" r="70" stroke-width="3" stroke="#90a4ae"/>
    <g stroke="#90a4ae" stroke-width="2">
      <line x1="250" y1="370" x2="250" y2="510"/>
      <line x1="180" y1="440" x2="320" y2="440"/>
      <line x1="200.5" y1="390.5" x2="299.5" y2="489.5"/>
      <line x1="299.5" y1="390.5" x2="200.5" y2="489.5"/>
      <line x1="223" y1="375" x2="277" y2="505"/>
      <line x1="277" y1="375" x2="223" y2="505"/>
      <line x1="185" y1="413" x2="315" y2="467"/>
      <line x1="315" y1="413" x2="185" y2="467"/>
    </g>
    <circle cx="250" cy="440" r="10" fill="#263238"/>

    <!-- 前輪 -->
    <circle cx="560" cy="440" r="80" stroke-width="10"/>
    <circle cx="560" cy="440" r="70" stroke-width="3" stroke="#90a4ae"/>
    <g stroke="#90a4ae" stroke-width="2">
      <line x1="560" y1="370" x2="560" y2="510"/>
      <line x1="490" y1="440" x2="630" y2="440"/>
      <line x1="510.5" y1="390.5" x2="609.5" y2="489.5"/>
      <line x1="609.5" y1="390.5" x2="510.5" y2="489.5"/>
      <line x1="533" y1="375" x2="587" y2="505"/>
      <line x1="587" y1="375" x2="533" y2="505"/>
      <line x1="495" y1="413" x2="625" y2="467"/>
      <line x1="625" y1="413" x2="495" y2="467"/>
    </g>
    <circle cx="560" cy="440" r="10" fill="#263238"/>

    <!-- チェーン -->
    <g stroke="#546e7a" stroke-width="3">
      <line x1="400" y1="406" x2="250" y2="430"/>
      <line x1="400" y1="454" x2="250" y2="450"/>
    </g>

    <!-- フレーム -->
    <g stroke="#d32f2f" stroke-width="9">
      <line x1="345" y1="305" x2="505" y2="300"/>
      <line x1="505" y1="300" x2="400" y2="430"/>
      <line x1="345" y1="305" x2="400" y2="430"/>
      <line x1="400" y1="430" x2="250" y2="440"/>
      <line x1="345" y1="305" x2="250" y2="440"/>
      <line x1="505" y1="300" x2="560" y2="440"/>
    </g>
    <!-- ヘッドチューブ・ステム・ハンドル -->
    <line x1="500" y1="275" x2="510" y2="330" stroke="#d32f2f" stroke-width="11"/>
    <line x1="500" y1="275" x2="502" y2="262" stroke="#263238" stroke-width="7"/>
    <path d="M 468 268 Q 502 252 536 268" stroke="#263238" stroke-width="8"/>
    <line x1="458" y1="270" x2="474" y2="266" stroke="#111" stroke-width="12"/>
    <line x1="530" y1="266" x2="546" y2="270" stroke="#111" stroke-width="12"/>

    <!-- シートポスト・サドル -->
    <line x1="345" y1="305" x2="340" y2="290" stroke="#263238" stroke-width="7"/>
    <path d="M 305 290 Q 340 278 375 288 Q 345 300 305 290 Z" fill="#111" stroke="#111" stroke-width="3"/>

    <!-- チェーンリング・クランク・ペダル -->
    <circle cx="400" cy="430" r="24" stroke-width="5"/>
    <circle cx="400" cy="430" r="7" fill="#263238"/>
    <line x1="400" y1="430" x2="432" y2="466" stroke-width="7"/>
    <line x1="400" y1="430" x2="368" y2="394" stroke-width="7"/>
    <line x1="418" y1="466" x2="446" y2="466" stroke="#111" stroke-width="7"/>
    <line x1="354" y1="394" x2="382" y2="394" stroke="#111" stroke-width="7"/>
  </g>

  <!-- ペリカン -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 脚（ペダルに足を乗せる） -->
    <g fill="none" stroke="#f57c00" stroke-width="9">
      <polyline points="335,285 350,345 368,392"/>
      <polyline points="350,282 405,370 432,463"/>
    </g>
    <path d="M 356 392 L 384 392 L 372 404 Z" fill="#f57c00"/>
    <path d="M 420 463 L 448 463 L 436 476 Z" fill="#f57c00"/>

    <!-- 尾羽 -->
    <path d="M 270 230 L 215 205 L 235 240 L 205 245 L 260 262 Z" fill="#eceff1" stroke="#455a64" stroke-width="3"/>

    <!-- 胴体 -->
    <ellipse cx="330" cy="235" rx="78" ry="60" fill="#ffffff" stroke="#455a64" stroke-width="4"/>

    <!-- 首 -->
    <path d="M 365 215 C 370 160 400 128 435 128" fill="none" stroke="#455a64" stroke-width="40"/>
    <path d="M 365 215 C 370 160 400 128 435 128" fill="none" stroke="#ffffff" stroke-width="32"/>

    <!-- のど袋（大きく垂れる） -->
    <path d="M 455 150 L 598 168 C 575 215 510 238 465 218 Q 440 200 452 160 Z" fill="#ffb74d" stroke="#e65100" stroke-width="3"/>
    <!-- 下くちばし -->
    <path d="M 455 150 L 598 168 L 460 162 Z" fill="#ffa726" stroke="#e65100" stroke-width="3"/>
    <!-- 上くちばし（大きい） -->
    <path d="M 445 118 L 602 164 L 455 152 Z" fill="#ffca28" stroke="#e65100" stroke-width="3"/>
    <path d="M 450 120 L 596 162" fill="none" stroke="#e65100" stroke-width="2"/>

    <!-- 頭 -->
    <circle cx="437" cy="130" r="30" fill="#ffffff" stroke="#455a64" stroke-width="4"/>
    <circle cx="450" cy="122" r="6" fill="#111"/>
    <circle cx="452" cy="120" r="2" fill="#fff"/>

    <!-- 翼（ハンドルを握る） -->
    <path d="M 345 205 Q 450 225 515 265 L 500 282 Q 420 262 335 262 Z" fill="#f5f5f5" stroke="#455a64" stroke-width="4"/>
    <path d="M 360 230 Q 430 240 495 270" fill="none" stroke="#b0bec5" stroke-width="3"/>
    <ellipse cx="518" cy="270" rx="14" ry="10" fill="#ffffff" stroke="#455a64" stroke-width="3"/>
  </g>
</svg>