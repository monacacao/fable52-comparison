<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ec1f2"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd16a"/>
      <stop offset="1" stop-color="#5fa845"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#f58a1f"/>
    </linearGradient>
  </defs>

  <!-- 空 -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- 太陽 -->
  <circle cx="680" cy="95" r="48" fill="#fff3a6" opacity="0.6"/>
  <circle cx="680" cy="95" r="34" fill="#ffe14d"/>

  <!-- 雲 -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="140" cy="110" rx="55" ry="24"/>
    <ellipse cx="180" cy="92" rx="42" ry="26"/>
    <ellipse cx="215" cy="112" rx="48" ry="20"/>
    <ellipse cx="560" cy="200" rx="40" ry="15" opacity="0.8"/>
    <ellipse cx="700" cy="230" rx="50" ry="18"/>
    <ellipse cx="735" cy="216" rx="34" ry="18"/>
  </g>

  <!-- 遠くの丘 -->
  <path d="M0 470 Q150 380 320 455 Q480 400 640 450 Q730 420 800 445 L800 520 L0 520 Z" fill="#a9dc8a"/>

  <!-- 地面 -->
  <rect x="0" y="480" width="800" height="120" fill="url(#grass)"/>
  <!-- 道 -->
  <rect x="0" y="492" width="800" height="50" fill="#b9b3a6"/>
  <rect x="0" y="492" width="800" height="5" fill="#a39d90"/>
  <g fill="#f4f0e4">
    <rect x="40" y="515" width="70" height="5"/>
    <rect x="200" y="515" width="70" height="5"/>
    <rect x="360" y="515" width="70" height="5"/>
    <rect x="520" y="515" width="70" height="5"/>
    <rect x="680" y="515" width="70" height="5"/>
  </g>

  <!-- 影 -->
  <ellipse cx="400" cy="503" rx="230" ry="9" fill="#000000" opacity="0.2"/>

  <!-- 奥側のクランク・ペダル・脚 -->
  <line x1="390" y1="430" x2="373" y2="398" stroke="#555" stroke-width="6" stroke-linecap="round"/>
  <rect x="356" y="394" width="34" height="7" rx="2" fill="#333"/>
  <path d="M350 282 L386 348 L373 388" fill="none" stroke="#c9741a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M370 384 L394 394 L360 394 Z" fill="#c9741a"/>

  <!-- 後輪 -->
  <g>
    <circle cx="250" cy="430" r="66" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="250" cy="430" r="60" fill="none" stroke="#c9c9c9" stroke-width="3"/>
    <g stroke="#9a9a9a" stroke-width="1.5">
      <line x1="190" y1="430" x2="310" y2="430"/>
      <line x1="250" y1="370" x2="250" y2="490"/>
      <line x1="207.600" y1="387.600" x2="292.400" y2="472.400"/>
      <line x1="207.600" y1="472.400" x2="292.400" y2="387.600"/>
      <line x1="194.600" y1="407" x2="305.400" y2="453"/>
      <line x1="194.600" y1="453" x2="305.400" y2="407"/>
      <line x1="227" y1="374.600" x2="273" y2="485.400"/>
      <line x1="273" y1="374.600" x2="227" y2="485.400"/>
    </g>
    <circle cx="250" cy="430" r="7" fill="#555"/>
  </g>

  <!-- 前輪 -->
  <g>
    <circle cx="550" cy="430" r="66" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="550" cy="430" r="60" fill="none" stroke="#c9c9c9" stroke-width="3"/>
    <g stroke="#9a9a9a" stroke-width="1.5">
      <line x1="490" y1="430" x2="610" y2="430"/>
      <line x1="550" y1="370" x2="550" y2="490"/>
      <line x1="507.600" y1="387.600" x2="592.400" y2="472.400"/>
      <line x1="507.600" y1="472.400" x2="592.400" y2="387.600"/>
      <line x1="494.600" y1="407" x2="605.400" y2="453"/>
      <line x1="494.600" y1="453" x2="605.400" y2="407"/>
      <line x1="527" y1="374.600" x2="573" y2="485.400"/>
      <line x1="573" y1="374.600" x2="527" y2="485.400"/>
    </g>
    <circle cx="550" cy="430" r="7" fill="#555"/>
  </g>

  <!-- フレーム -->
  <g fill="none" stroke="#e23b3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="250" y1="430" x2="390" y2="430"/>
    <line x1="250" y1="430" x2="362" y2="312"/>
    <line x1="360" y1="300" x2="390" y2="430"/>
    <line x1="362" y1="312" x2="512" y2="302"/>
    <line x1="390" y1="430" x2="512" y2="302"/>
    <line x1="512" y1="302" x2="550" y2="430"/>
  </g>

  <!-- ハンドル(ステムとバー) -->
  <line x1="512" y1="302" x2="505" y2="262" stroke="#777" stroke-width="6" stroke-linecap="round"/>
  <path d="M507 262 L482 258" fill="none" stroke="#777" stroke-width="6" stroke-linecap="round"/>
  <path d="M496 260 L478 257" fill="none" stroke="#222" stroke-width="9" stroke-linecap="round"/>

  <!-- サドル -->
  <path d="M322 290 Q322 282 334 284 L388 290 Q398 292 394 298 Q372 304 330 300 Q322 298 322 290 Z" fill="#3a2a20"/>

  <!-- チェーンリング -->
  <circle cx="390" cy="430" r="17" fill="#d8d8d8" stroke="#666" stroke-width="3"/>
  <circle cx="390" cy="430" r="5" fill="#555"/>
  <path d="M250 424 L390 414 M250 436 L390 446" stroke="#555" stroke-width="2" fill="none"/>

  <!-- ペリカン:尾 -->
  <path d="M286 236 L246 222 L262 246 L240 258 L288 270 Z" fill="#f4f4f0" stroke="#6b6b6b" stroke-width="2.500" stroke-linejoin="round"/>

  <!-- ペリカン:首 -->
  <path d="M380 205 C415 200 420 165 420 125 L470 128 C472 185 455 240 405 268 Z" fill="#fbfbf7" stroke="#6b6b6b" stroke-width="2.500" stroke-linejoin="round"/>

  <!-- ペリカン:胴体 -->
  <ellipse cx="350" cy="235" rx="80" ry="57" transform="rotate(-12 350 235)" fill="#fbfbf7" stroke="#6b6b6b" stroke-width="2.500"/>
  <!-- 首と胴のつなぎ目を消す -->
  <ellipse cx="400" cy="228" rx="24" ry="30" transform="rotate(-30 400 228)" fill="#fbfbf7"/>

  <!-- 手前の脚 -->
  <path d="M372 283 L426 366 L409 452" fill="none" stroke="#f08a24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="426" cy="366" r="6" fill="#f08a24"/>
  <!-- 手前のクランクとペダル -->
  <line x1="390" y1="430" x2="407" y2="462" stroke="#444" stroke-width="6" stroke-linecap="round"/>
  <rect x="388" y="460" width="40" height="8" rx="2" fill="#222"/>
  <!-- 水かきのある足(ペダルの上) -->
  <path d="M405 446 L436 460 L392 460 Z" fill="#f08a24" stroke="#c96a12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M407 449 L420 459 M406 449 L406 459" stroke="#c96a12" stroke-width="1.500" fill="none"/>

  <!-- 腿の付け根の羽 -->
  <ellipse cx="368" cy="278" rx="20" ry="14" fill="#fbfbf7"/>

  <!-- ペリカン:頭 -->
  <circle cx="445" cy="122" r="30" fill="#fbfbf7" stroke="#6b6b6b" stroke-width="2.500"/>
  <!-- 首とのつなぎ目を消す -->
  <ellipse cx="445" cy="140" rx="23" ry="16" fill="#fbfbf7"/>
  <!-- 冠羽 -->
  <path d="M420 106 L398 96 L416 114 L400 116 L418 124" fill="#fbfbf7" stroke="#6b6b6b" stroke-width="2" stroke-linejoin="round"/>

  <!-- のど袋 -->
  <path d="M464 136 Q470 228 556 196 Q592 182 612 166 Z" fill="url(#pouch)" stroke="#b9620f" stroke-width="2.500" stroke-linejoin="round"/>
  <path d="M480 160 Q500 196 545 186 M500 158 Q520 180 565 174" fill="none" stroke="#d9781a" stroke-width="1.500" opacity="0.7"/>

  <!-- 上くちばし -->
  <path d="M462 106 L608 152 Q622 158 620 170 Q616 176 608 168 L464 140 Z" fill="#ffd257" stroke="#b9620f" stroke-width="2.500" stroke-linejoin="round"/>
  <path d="M466 124 L606 162" stroke="#d9941a" stroke-width="1.500" fill="none"/>

  <!-- 目 -->
  <circle cx="452" cy="112" r="8" fill="#ffe9a8" stroke="#6b6b6b" stroke-width="1.500"/>
  <circle cx="453" cy="112" r="4.500" fill="#1c1c1c"/>
  <circle cx="454.500" cy="110.500" r="1.500" fill="#ffffff"/>

  <!-- 翼(ハンドルを握っている) -->
  <path d="M330 212 C375 196 440 232 494 250 Q502 258 492 266 C445 272 380 288 330 266 Q310 240 330 212 Z" fill="#eef0ee" stroke="#6b6b6b" stroke-width="2.500" stroke-linejoin="round"/>
  <path d="M345 232 C385 232 430 250 470 258 M345 250 C380 256 420 264 455 266" fill="none" stroke="#b5b8b5" stroke-width="2"/>
  <!-- 翼の先(黒い風切羽がグリップを握る) -->
  <path d="M470 246 Q490 246 498 252 Q504 259 496 266 Q484 270 468 268 Q478 258 470 246 Z" fill="#3a3a3a"/>
  <path d="M480 250 L482 266 M488 250 L490 267" stroke="#666" stroke-width="1.500"/>
</svg>