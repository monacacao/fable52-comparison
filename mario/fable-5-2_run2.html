<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Runner 1-1</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: min(100vw, calc(100vh * 1.6));
    height: auto;
    image-rendering: pixelated;
    background: #7ec0ff;
    display: block;
  }
</style>
</head>
<body>
<canvas id="g" width="768" height="480"></canvas>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('g');
  const c = cv.getContext('2d');
  const W = 768, H = 480, T = 32, COLS = 212, ROWS = 15;
  const GROUND_Y = 13 * T;
  const FLAG_COL = 198;
  const POLE_X = FLAG_COL * T + 14;
  const DOOR_X = 204 * T + 5;

  // ---------- 入力 ----------
  const keys = {};
  let jumpBuf = 0, pressed = false;
  const USED = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
  window.addEventListener('keydown', function (e) {
    if (USED.indexOf(e.code) >= 0) e.preventDefault();
    if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) { jumpBuf = 8; pressed = true; }
    keys[e.code] = true;
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  function jumpHeld() { return !!(keys.Space || keys.ArrowUp); }

  // ---------- ゲーム状態 ----------
  let map, pipes, enemies, particles, popups, coinsFx, bumps;
  let p, camX, state, score = 0, coins = 0, lives = 3, time, frame, deadT, flagY, combo, hidden;

  function setTile(x, y, ch) { if (x >= 0 && x < COLS && y >= 0 && y < ROWS) map[y][x] = ch; }
  function addPipe(x, h) {
    for (let dx = 0; dx < 2; dx++) for (let k = 0; k < h; k++) setTile(x + dx, 12 - k, 'P');
    pipes.push({ x: x, h: h });
  }
  function column(x, h) { for (let k = 0; k < h; k++) setTile(x, 12 - k, 'S'); }
  function addEnemy(tx, row) {
    enemies.push({ x: tx * T, y: (row === undefined ? 13 : row) * T - 28, w: 28, h: 28,
      vx: 0, vy: 0, dir: -1, active: false, dead: false, flip: false, t: 0, onGround: false, hitWall: false });
  }

  function buildLevel() {
    map = []; pipes = []; enemies = []; particles = []; popups = []; coinsFx = []; bumps = [];
    for (let y = 0; y < ROWS; y++) { map.push(new Array(COLS).fill(' ')); }
    const gaps = [69, 70, 86, 87, 88, 153, 154];
    for (let x = 0; x < COLS; x++) {
      if (gaps.indexOf(x) >= 0) continue;
      map[13][x] = '#'; map[14][x] = '#';
    }
    const row = function (y, str, x0) { for (let i = 0; i < str.length; i++) if (str[i] !== ' ') setTile(x0 + i, y, str[i]); };
    // 序盤
    row(9, '?', 16);
    row(9, 'B?B?B', 20);
    row(5, '?', 22);
    addPipe(28, 2); addPipe(38, 3); addPipe(46, 4); addPipe(57, 4);
    // 中盤
    row(9, 'B?B', 77);
    row(5, 'BBBBBBBB', 80);
    row(5, 'BBB?', 91);
    row(9, 'B', 94);
    row(9, 'BB', 100);
    row(9, '?  ?  ?', 106);
    row(5, '?', 109);
    row(9, 'B', 118);
    row(5, 'BBB', 121);
    row(5, 'B??B', 128);
    row(9, 'BB', 129);
    // 階段
    for (let i = 0; i < 4; i++) { column(134 + i, i + 1); column(140 + i, 4 - i); }
    for (let i = 0; i < 4; i++) { column(148 + i, i + 1); column(155 + i, 4 - i); }
    column(152, 4);
    addPipe(163, 2);
    row(9, 'BB?B', 168);
    addPipe(179, 2);
    for (let i = 0; i < 8; i++) column(181 + i, i + 1);
    column(189, 8);
    // 旗の土台
    setTile(FLAG_COL, 12, 'S');
    // 敵
    [22, 40, 51, 52.5, 97, 98.5, 114, 115.5, 124, 125.5, 128, 129.5, 174, 175.5].forEach(function (x) { addEnemy(x); });
    addEnemy(80, 5); addEnemy(82, 5);
  }

  function resetLevel() {
    buildLevel();
    p = { x: 3 * T, y: GROUND_Y - 30, w: 22, h: 30, vx: 0, vy: 0, onGround: false, hitWall: false,
      face: 1, coyote: 0, walkT: 0, headHit: null };
    camX = 0; state = 'play'; time = 400; frame = 0; deadT = 0; flagY = 104; combo = 0; hidden = false;
    jumpBuf = 0; pressed = false;
  }
  function fullReset() { score = 0; coins = 0; lives = 3; resetLevel(); }

  // ---------- 当たり判定 ----------
  function solid(tx, ty) {
    if (tx < 0 || tx >= COLS) return true;
    if (ty < 0 || ty >= ROWS) return false;
    return map[ty][tx] !== ' ';
  }

  function stepEntity(e) {
    e.hitWall = false; e.headHit = null;
    // X
    e.x += e.vx;
    let top = Math.floor(e.y / T), bot = Math.floor((e.y + e.h - 1) / T);
    if (e.vx > 0) {
      const tx = Math.floor((e.x + e.w - 1) / T);
      for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { e.x = tx * T - e.w; e.vx = 0; e.hitWall = true; break; }
    } else if (e.vx < 0) {
      const tx = Math.floor(e.x / T);
      for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { e.x = (tx + 1) * T; e.vx = 0; e.hitWall = true; break; }
    }
    // Y
    e.y += e.vy;
    e.onGround = false;
    const l = Math.floor(e.x / T), r = Math.floor((e.x + e.w - 1) / T);
    if (e.vy > 0) {
      const ty = Math.floor((e.y + e.h - 1) / T);
      for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { e.y = ty * T - e.h; e.vy = 0; e.onGround = true; break; }
    } else if (e.vy < 0) {
      const ty = Math.floor(e.y / T);
      let hit = -1;
      const cxT = Math.floor((e.x + e.w / 2) / T);
      if (solid(cxT, ty)) hit = cxT;
      else for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { hit = tx; break; }
      if (hit >= 0) { e.y = (ty + 1) * T; e.vy = 0; e.headHit = { tx: hit, ty: ty }; }
    }
  }

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function addScore(n, x, y) {
    score += n;
    popups.push({ x: x, y: y, txt: String(n), t: 45 });
  }

  function bumpTile(tx, ty) {
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
    const ch = map[ty][tx];
    if (ch !== '?' && ch !== 'B') return;
    // 上に乗っている敵を倒す
    enemies.forEach(function (e) {
      if (e.dead || e.flip || !e.active) return;
      if (Math.abs(e.y + e.h - ty * T) < 3 && e.x + e.w > tx * T && e.x < tx * T + T) {
        e.flip = true; e.vy = -7;
        addScore(100, e.x, e.y);
      }
    });
    if (ch === '?') {
      map[ty][tx] = 'U';
      coins++;
      coinsFx.push({ x: tx * T + 10, y: ty * T - 20, vy: -7, t: 30 });
      addScore(200, tx * T + 4, ty * T - 30);
      bumps.push({ tx: tx, ty: ty, t: 8 });
    } else {
      map[ty][tx] = ' ';
      score += 50;
      for (let i = 0; i < 4; i++) {
        particles.push({ x: tx * T + (i % 2) * 16, y: ty * T + (i < 2 ? 0 : 16),
          vx: (i % 2 ? 2 : -2), vy: (i < 2 ? -8 : -5), t: 60 });
      }
    }
  }

  function die() {
    if (state !== 'play') return;
    state = 'dead'; deadT = 0; p.vx = 0; p.vy = -11;
  }

  // ---------- 更新 ----------
  function updatePlay() {
    frame++;
    if (frame % 24 === 0) { time--; if (time <= 0) { time = 0; die(); return; } }

    const ax = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
    if (ax !== 0) {
      p.face = ax;
      p.vx += ax * (p.onGround ? 0.3 : 0.2);
      if (p.vx * ax < 0) p.vx += ax * 0.25; // 切り返しの減速
    } else {
      const f = p.onGround ? 0.25 : 0.04;
      if (Math.abs(p.vx) <= f) p.vx = 0; else p.vx -= Math.sign(p.vx) * f;
    }
    const MAX = 4.6;
    if (p.vx > MAX) p.vx = MAX;
    if (p.vx < -MAX) p.vx = -MAX;

    if (jumpBuf > 0 && p.coyote > 0) { p.vy = -12.2; jumpBuf = 0; p.coyote = 0; }
    if (jumpBuf > 0) jumpBuf--;

    const g = (p.vy < 0 && jumpHeld()) ? 0.5 : 1.1; // 長押しで高く
    p.vy = Math.min(p.vy + g, 12);

    stepEntity(p);
    if (p.headHit) bumpTile(p.headHit.tx, p.headHit.ty);
    if (p.x < camX) { p.x = camX; if (p.vx < 0) p.vx = 0; }
    if (p.onGround) { p.coyote = 6; combo = 0; } else if (p.coyote > 0) p.coyote--;
    if (p.onGround && Math.abs(p.vx) > 0.3) p.walkT += Math.abs(p.vx); else if (p.onGround) p.walkT = 0;

    if (p.y > H + 40) { state = 'dead'; deadT = 60; p.vy = 0; return; }

    updateEnemies(true);

    // ゴール
    if (state === 'play' && p.x + p.w >= FLAG_COL * T) {
      state = 'flag';
      p.vx = 0; p.vy = 0;
      p.x = POLE_X - p.w + 2;
      p.y = Math.max(96, Math.min(p.y, 384 - p.h));
      const hgt = GROUND_Y - (p.y + p.h);
      const pts = hgt > 240 ? 5000 : hgt > 180 ? 2000 : hgt > 120 ? 800 : hgt > 60 ? 400 : 100;
      addScore(pts, POLE_X + 12, p.y);
    }
  }

  function updateEnemies(interact) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (!e.active) { if (e.x < camX + W + 48) e.active = true; else continue; }
      if (e.dead) { if (--e.t <= 0) enemies.splice(i, 1); continue; }
      if (e.flip) {
        e.vy += 0.6; e.y += e.vy; e.x += e.dir * 1.5;
        if (e.y > H + 60) enemies.splice(i, 1);
        continue;
      }
      e.vx = e.dir * 1.1;
      e.vy = Math.min(e.vy + 0.8, 12);
      stepEntity(e);
      if (e.hitWall) e.dir *= -1;
      if (e.y > H + 60) { enemies.splice(i, 1); continue; }
      e.t++;
    }
    // 敵同士
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      if (!a.active || a.dead || a.flip) continue;
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        if (!b.active || b.dead || b.flip) continue;
        if (overlap(a, b)) {
          if (a.x < b.x) { a.dir = -1; b.dir = 1; } else { a.dir = 1; b.dir = -1; }
        }
      }
    }
    if (!interact) return;
    // プレイヤーとの接触
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.active || e.dead || e.flip) continue;
      if (!overlap(p, e)) continue;
      if (p.vy > 0 && p.y + p.h - e.y <= 16 + p.vy) {
        e.dead = true; e.t = 30;
        p.y = e.y - p.h;
        p.vy = jumpHeld() ? -9.5 : -6.5;
        combo++;
        addScore(100 * Math.pow(2, Math.min(combo - 1, 4)), e.x, e.y - 10);
      } else {
        die();
        return;
      }
    }
  }

  function updateFx() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.vy += 0.6; q.x += q.vx; q.y += q.vy;
      if (--q.t <= 0 || q.y > H + 20) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 0.8;
      if (--popups[i].t <= 0) popups.splice(i, 1);
    }
    for (let i = coinsFx.length - 1; i >= 0; i--) {
      const q = coinsFx[i];
      q.vy += 0.5; q.y += q.vy;
      if (--q.t <= 0) coinsFx.splice(i, 1);
    }
    for (let i = bumps.length - 1; i >= 0; i--) if (--bumps[i].t <= 0) bumps.splice(i, 1);
  }

  function update() {
    if (state === 'play') {
      updatePlay();
    } else if (state === 'dead') {
      deadT++;
      if (deadT > 20) { p.vy += 0.6; p.y += p.vy; }
      if (deadT > 150) {
        lives--;
        if (lives <= 0) { state = 'over'; pressed = false; } else resetLevel();
      }
    } else if (state === 'flag') {
      let done = true;
      if (p.y + p.h < 384) { p.y = Math.min(p.y + 3, 384 - p.h); done = false; }
      if (flagY < 352) { flagY = Math.min(flagY + 3, 352); done = false; }
      if (done) { state = 'walk'; p.face = 1; }
    } else if (state === 'walk') {
      p.vx = 2;
      p.vy = Math.min(p.vy + 1.1, 12);
      stepEntity(p);
      p.walkT += 2;
      if (p.x >= DOOR_X) { hidden = true; state = 'clear'; pressed = false; }
    } else if (state === 'clear') {
      if (time > 0) {
        const d = Math.min(time, 2);
        time -= d; score += 50 * d;
        pressed = false;
      } else if (pressed) { fullReset(); }
    } else if (state === 'over') {
      if (pressed) fullReset();
    }
    pressed = false;
    updateFx();

    if (state !== 'dead') {
      const target = p.x - W * 0.4;
      camX = Math.max(0, Math.min(target, COLS * T - W));
    }
  }

  // ---------- 描画 ----------
  function rect(x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }

  function drawBackground(cx) {
    rect(0, 0, W, H, '#7ec0ff');
    // 雲(パララックス)
    const cxs = [8, 19, 27, 36];
    const cys = [70, 40, 90, 55];
    const off = cx * 0.5;
    for (let k = 0; k < 6; k++) {
      for (let i = 0; i < 4; i++) {
        const x = (cxs[i] + k * 40) * T - off, y = cys[i];
        if (x < -120 || x > W + 20) continue;
        c.fillStyle = '#ffffff';
        c.fillRect(x, y + 12, 96, 20);
        c.fillRect(x + 14, y, 40, 20);
        c.fillRect(x + 46, y + 5, 30, 14);
      }
    }
    // 丘
    for (let k = 0; k < 5; k++) {
      const x = k * 48 * T - cx;
      if (x > -200 && x < W + 10) {
        c.fillStyle = '#3fa35a';
        c.beginPath(); c.moveTo(x, GROUND_Y); c.lineTo(x + 80, GROUND_Y - 70); c.lineTo(x + 160, GROUND_Y); c.fill();
        rect(x + 70, GROUND_Y - 44, 6, 12, '#2c7a41');
        rect(x + 92, GROUND_Y - 30, 6, 12, '#2c7a41');
      }
      // 茂み
      const bx = [11, 23, 41];
      for (let i = 0; i < 3; i++) {
        const x2 = (bx[i] + k * 48) * T - cx;
        if (x2 < -120 || x2 > W + 10) continue;
        c.fillStyle = '#58c46c';
        c.fillRect(x2, GROUND_Y - 14, 84, 14);
        c.fillRect(x2 + 12, GROUND_Y - 24, 28, 12);
        c.fillRect(x2 + 44, GROUND_Y - 20, 24, 8);
      }
    }
  }

  function drawTile(ch, x, y) {
    if (ch === '#') {
      rect(x, y, T, T, '#b9692f');
      rect(x, y, T, 2, '#e0a070');
      rect(x + 15, y, 2, T, '#8a4a1e');
      rect(x, y + 15, T, 2, '#8a4a1e');
    } else if (ch === 'B') {
      rect(x, y, T, T, '#c0552b');
      c.fillStyle = '#5e2412';
      c.fillRect(x, y + 7, T, 2); c.fillRect(x, y + 15, T, 2); c.fillRect(x, y + 23, T, 2); c.fillRect(x, y + 30, T, 2);
      c.fillRect(x + 15, y, 2, 8); c.fillRect(x + 7, y + 8, 2, 8); c.fillRect(x + 23, y + 8, 2, 8);
      c.fillRect(x + 15, y + 16, 2, 8); c.fillRect(x + 7, y + 24, 2, 8); c.fillRect(x + 23, y + 24, 2, 8);
    } else if (ch === '?') {
      rect(x, y, T, T, '#f5b400');
      rect(x, y, T, 2, '#ffe07a'); rect(x, y, 2, T, '#ffe07a');
      rect(x, y + T - 2, T, 2, '#9a6a00'); rect(x + T - 2, y, 2, T, '#9a6a00');
      c.fillStyle = '#7a4a00';
      c.fillRect(x + 4, y + 4, 2, 2); c.fillRect(x + 26, y + 4, 2, 2);
      c.fillRect(x + 4, y + 26, 2, 2); c.fillRect(x + 26, y + 26, 2, 2);
      // ? を四角で描く
      const blink = (Math.floor(frame / 20) % 3 === 0) ? '#b07800' : '#7a4a00';
      c.fillStyle = blink;
      c.fillRect(x + 11, y + 7, 10, 3);
      c.fillRect(x + 9, y + 9, 4, 4);
      c.fillRect(x + 19, y + 9, 4, 6);
      c.fillRect(x + 15, y + 14, 6, 3);
      c.fillRect(x + 14, y + 16, 4, 4);
      c.fillRect(x + 14, y + 22, 4, 4);
    } else if (ch === 'U') {
      rect(x, y, T, T, '#8f6f4f');
      rect(x, y + T - 2, T, 2, '#5c452e'); rect(x + T - 2, y, 2, T, '#5c452e');
      rect(x, y, T, 2, '#b08c68'); rect(x, y, 2, T, '#b08c68');
    } else if (ch === 'S') {
      rect(x, y, T, T, '#a8794a');
      rect(x, y, T, 3, '#d9b488'); rect(x, y, 3, T, '#d9b488');
      rect(x, y + T - 3, T, 3, '#6b4726'); rect(x + T - 3, y, 3, T, '#6b4726');
    }
  }

  function drawTiles(cx) {
    const x0 = Math.max(0, Math.floor(cx / T)), x1 = Math.min(COLS - 1, x0 + Math.ceil(W / T) + 1);
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const ch = map[ty][tx];
        if (ch === ' ' || ch === 'P') continue;
        let oy = 0;
        for (let i = 0; i < bumps.length; i++) {
          if (bumps[i].tx === tx && bumps[i].ty === ty) oy = -Math.sin((8 - bumps[i].t) / 8 * Math.PI) * 8;
        }
        drawTile(ch, tx * T - cx, ty * T + Math.round(oy));
      }
    }
  }

  function drawPipes(cx) {
    pipes.forEach(function (q) {
      const x = q.x * T - cx, y = (13 - q.h) * T, h = q.h * T;
      if (x < -80 || x > W + 10) return;
      rect(x + 3, y, 58, h, '#2aa84a');
      rect(x + 8, y, 8, h, '#7fe08f');
      rect(x + 48, y, 10, h, '#17702e');
      rect(x, y, 64, 16, '#2aa84a');
      rect(x + 5, y + 2, 8, 12, '#7fe08f');
      rect(x + 52, y + 2, 9, 12, '#17702e');
      c.strokeStyle = '#0d4a1d'; c.lineWidth = 2;
      c.strokeRect(x + 1, y + 1, 62, 15);
    });
  }

  function drawGoal(cx) {
    // ポール
    const px = POLE_X - cx;
    if (px > -300 && px < W + 50) {
      rect(px, 96, 4, 288, '#e8e8e8');
      c.fillStyle = '#ffd400';
      c.beginPath(); c.arc(px + 2, 92, 7, 0, Math.PI * 2); c.fill();
      // 旗
      c.fillStyle = '#e8453c';
      c.beginPath(); c.moveTo(px, flagY); c.lineTo(px - 30, flagY + 13); c.lineTo(px, flagY + 26); c.fill();
    }
    // 城
    const x = 202 * T - cx;
    if (x > -200 && x < W + 10) {
      rect(x, 288, 160, 128, '#9c8f86');
      for (let i = 0; i < 5; i++) rect(x + i * 32, 272, 20, 16, '#9c8f86');
      rect(x + 40, 208, 80, 80, '#8a7d75');
      for (let i = 0; i < 3; i++) rect(x + 40 + i * 30, 194, 20, 14, '#8a7d75');
      rect(x + 70, 232, 20, 26, '#2b2430');
      rect(x + 64, 352, 32, 64, '#2b2430');
      rect(x + 68, 344, 24, 8, '#2b2430');
      c.fillStyle = '#6f645d';
      for (let r = 0; r < 4; r++) c.fillRect(x, 318 + r * 30, 160, 2);
      rect(x + 64, 352, 32, 64, '#2b2430');
    }
  }

  function drawEnemy(e, cx) {
    const x = Math.round(e.x - cx), y = Math.round(e.y);
    if (x < -40 || x > W + 40) return;
    if (e.dead) {
      rect(x, y + 18, 28, 10, '#7b3fa0');
      rect(x + 4, y + 21, 20, 2, '#3c1c52');
      return;
    }
    c.save();
    if (e.flip) { c.translate(x + 14, y + 14); c.scale(1, -1); c.translate(-(x + 14), -(y + 14)); }
    // からだ
    rect(x + 2, y + 4, 24, 18, '#7b3fa0');
    rect(x + 6, y, 16, 6, '#7b3fa0');
    rect(x, y + 10, 28, 10, '#7b3fa0');
    // 目
    rect(x + 6, y + 8, 6, 8, '#fff'); rect(x + 16, y + 8, 6, 8, '#fff');
    const ex = e.dir < 0 ? 0 : 3;
    rect(x + 6 + ex, y + 11, 3, 5, '#111'); rect(x + 16 + ex, y + 11, 3, 5, '#111');
    rect(x + 5, y + 6, 8, 2, '#3c1c52'); rect(x + 15, y + 6, 8, 2, '#3c1c52');
    // 足
    const s = (Math.floor(e.t / 8) % 2) ? 2 : 0;
    rect(x + 1 + s, y + 22, 10, 6, '#3c1c52');
    rect(x + 17 - s, y + 22, 10, 6, '#3c1c52');
    c.restore();
  }

  function drawPlayer(cx) {
    if (hidden) return;
    const x = Math.round(p.x - cx), y = Math.round(p.y);
    const f = p.face;
    // 足
    let l1 = 0, l2 = 0;
    if (state === 'dead') { l1 = -2; l2 = 2; }
    else if (!p.onGround && state !== 'flag') { l1 = -3; l2 = 3; }
    else if (Math.abs(p.vx) > 0.3) { const s = Math.floor(p.walkT / 10) % 2; l1 = s ? -3 : 2; l2 = s ? 2 : -3; }
    rect(x + 3 + l1, y + 24, 7, 6, '#26324a');
    rect(x + 12 + l2, y + 24, 7, 6, '#26324a');
    // 胴
    rect(x + 2, y + 12, 18, 13, '#1fb5a8');
    rect(x + 2, y + 20, 18, 3, '#14857b');
    // 腕
    rect(f > 0 ? x : x + 18, y + 13, 4, 8, '#f2c9a0');
    // 頭
    rect(x + 3, y + 2, 16, 11, '#f2c9a0');
    // 帽子(黄色のヘルメット)
    rect(x + 2, y, 18, 5, '#f2c230');
    rect(f > 0 ? x + 14 : x - 2, y + 3, 10, 3, '#f2c230');
    // 目
    if (state === 'dead') {
      rect(x + 6, y + 7, 4, 2, '#111'); rect(x + 13, y + 7, 4, 2, '#111');
    } else {
      rect(f > 0 ? x + 13 : x + 6, y + 6, 3, 4, '#111');
    }
  }

  function drawFx(cx) {
    particles.forEach(function (q) {
      rect(q.x - cx, q.y, 14, 14, '#c0552b');
      rect(q.x - cx, q.y + 6, 14, 2, '#5e2412');
    });
    coinsFx.forEach(function (q) {
      const w = [10, 6, 2, 6][Math.floor(q.t / 3) % 4];
      rect(q.x - cx + (12 - w) / 2, q.y, w, 16, '#ffd400');
      if (w > 4) rect(q.x - cx + 5, q.y + 3, 2, 10, '#b88600');
    });
    c.font = 'bold 14px monospace'; c.textAlign = 'left'; c.fillStyle = '#fff';
    popups.forEach(function (q) { c.fillText(q.txt, q.x - cx, q.y); });
  }

  function pad(n, len) { let s = String(n); while (s.length < len) s = '0' + s; return s; }

  function drawHud() {
    c.font = 'bold 18px monospace'; c.textAlign = 'left'; c.fillStyle = '#fff';
    c.fillText('SCORE', 24, 26); c.fillText(pad(score, 6), 24, 46);
    c.fillText('COIN', 200, 26);
    rect(200, 34, 8, 12, '#ffd400'); c.fillStyle = '#fff';
    c.fillText('x' + pad(coins, 2), 214, 46);
    c.fillText('WORLD', 350, 26); c.fillText(' 1-1', 350, 46);
    c.fillText('TIME', 520, 26); c.fillText(' ' + pad(time, 3), 520, 46);
    c.fillText('LIFE', 670, 26); c.fillText(' x' + lives, 670, 46);

    if (state === 'over' || state === 'clear') {
      c.fillStyle = 'rgba(0,0,0,0.45)';
      c.fillRect(0, 170, W, 130);
      c.textAlign = 'center'; c.fillStyle = '#fff';
      c.font = 'bold 36px monospace';
      c.fillText(state === 'over' ? 'GAME OVER' : 'COURSE CLEAR!', W / 2, 225);
      c.font = 'bold 18px monospace';
      if (state === 'over' || time === 0) c.fillText('スペースキーでもう一度', W / 2, 270);
      else c.fillText('TIME BONUS...', W / 2, 270);
    }
  }

  function draw() {
    const cx = Math.round(camX);
    drawBackground(cx);
    drawGoal(cx);
    drawPipes(cx);
    drawTiles(cx);
    enemies.forEach(function (e) { if (e.active) drawEnemy(e, cx); });
    drawPlayer(cx);
    drawFx(cx);
    drawHud();
  }

  // ---------- メインループ(60fps 固定ステップ) ----------
  let last = 0, acc = 0;
  const STEP = 1000 / 60;
  function loop(now) {
    if (!last) last = now;
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    draw();
    requestAnimationFrame(loop);
  }

  fullReset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
